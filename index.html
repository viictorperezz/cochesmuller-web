<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coches Muller · Pronto empezaremos</title>
<meta name="description" content="Coches Muller. Pronto empezaremos.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,800;1,500&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0f1a2c; --orange: #ff6b2c; --white: #fff; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    background: var(--navy); color: var(--white);
    font-family: Barlow, system-ui, sans-serif; font-style: italic;
    display: grid; place-items: center; text-align: center; padding: 24px 16px;
  }
  main { display: grid; justify-items: center; gap: 28px; width: 100%; }
  .logo { width: min(420px, 80vw); height: auto; overflow: visible; }
  /* Sin JS o con movimiento reducido se ve el logo final: puntos sin llanta */
  .rim, .speed { opacity: 0; }

  .text { animation: fade-in .6s .8s backwards; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } }
  h1 { font-weight: 800; font-size: clamp(28px, 7vw, 56px); letter-spacing: .04em; line-height: 1; }
  h1 span { color: var(--orange); }
  p { margin-top: 14px; font-weight: 500; font-size: clamp(16px, 3.6vw, 22px); letter-spacing: .3em; opacity: .85; }
  .dots i { animation: blink 1.4s infinite; font-style: normal; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <!-- Coordenadas sacadas del logo original (IMG_1051) -->
  <svg class="logo" viewBox="140 600 1640 760" role="img" aria-label="Logo de Coches Muller">
    <defs>
      <polygon id="M" stroke-width="14" stroke-linejoin="round"
        points="962,640 1266,640 1300,905 1448,640 1752,640 1628,1282 1414,1282 1462,975 1290,1282 1152,1282 1120,972 1040,1282 828,1282"/>
      <!-- Llanta como en el vídeo: aro, buje y 5 tornillos -->
      <g id="rim" fill="var(--navy)">
        <circle r="98" fill="none" stroke="var(--navy)" stroke-width="7"/>
        <circle r="20"/>
        <circle r="8" cx="0" cy="-55"/>
        <circle r="8" cx="52" cy="-17"/>
        <circle r="8" cx="32" cy="45"/>
        <circle r="8" cx="-32" cy="45"/>
        <circle r="8" cx="-52" cy="-17"/>
      </g>
      <g id="speed" stroke-width="14" stroke-linecap="round">
        <line x1="-330" y1="-50" x2="-210" y2="-50"/>
        <line x1="-360" y1="0" x2="-210" y2="0"/>
        <line x1="-330" y1="50" x2="-210" y2="50"/>
      </g>
    </defs>

    <g id="m" fill="var(--white)" stroke="var(--white)">
      <use href="#M" opacity=".1"/>
      <use href="#M" opacity=".2"/>
      <use href="#M" opacity=".3"/>
      <use href="#M" opacity=".4"/>
      <use href="#M" opacity=".5"/>
      <use href="#M"/>
    </g>

    <g transform="translate(678 966)"><g class="wheel"><g><g>
      <use class="speed" href="#speed" stroke="var(--orange)"/>
      <g><circle r="154" fill="var(--orange)"/><use class="rim" href="#rim"/></g>
    </g></g></g></g>
    <g transform="translate(320 966)"><g class="wheel"><g><g>
      <use class="speed" href="#speed" stroke="var(--white)"/>
      <g><circle r="154" fill="var(--white)"/><use class="rim" href="#rim"/></g>
    </g></g></g></g>
  </svg>
  <div class="text">
    <h1>COCHES <span>MULLER</span></h1>
    <p>PRONTO EMPEZAREMOS<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
  </div>
</main>
<script>
// Tiempos y curvas medidos fotograma a fotograma en el vídeo del logo (en segundos). Todo se repite cada P.
const P = 5.2;
const OUT3 = 'cubic-bezier(.33,1,.68,1)', OUT4 = 'cubic-bezier(.25,1,.5,1)', IO = 'cubic-bezier(.45,0,.55,1)';

// keys: [segundo, propiedades, curva hasta la siguiente]; antes de la primera y tras la última se mantiene el valor
function play(el, keys) {
  const f = keys.map(([t, props, easing = 'linear']) => ({ ...props, offset: t / P, easing }));
  if (f[0].offset > 0) f.unshift({ ...f[0], offset: 0, easing: 'linear' });
  if (f.at(-1).offset < 1) f.push({ ...f.at(-1), offset: 1, easing: 'linear' });
  el.animate(f, { duration: P * 1000, iterations: Infinity });
}

function wheel(g, enter, hop) {
  const [x, y, s, roll] = [g, g.firstElementChild, g.firstElementChild.firstElementChild, g.querySelector('use + g')];
  // Llega rodando por el suelo y frena; luego salta hasta su sitio
  play(x, [[enter, { transform: 'translateX(-1201px)' }, OUT3], [enter + .65, { transform: 'translateX(-108px)' }],
           [hop, { transform: 'translateX(-108px)' }, IO], [hop + .3, { transform: 'translateX(0px)' }]]);
  play(roll, [[enter, { transform: 'rotate(-405deg)' }, OUT3], [enter + .65, { transform: 'rotate(0deg)' }]]);
  play(g.querySelector('.speed'), [[enter, { opacity: .8 }, OUT3], [enter + .35, { opacity: 0 }]]);
  // Salto con rebote tipo muelle (sube, se pasa, se aplasta al caer y se asienta)
  play(y, [[0, { opacity: 0 }], [enter, { opacity: 0 }], [enter + .05, { opacity: 1 }]]);
  play(y, [[hop, { transform: 'translateY(162px)' }, 'cubic-bezier(.3,.38,.65,1)'], [hop + .2, { transform: 'translateY(-46px)' }, IO],
           [hop + .34, { transform: 'translateY(25px)' }, IO], [hop + .48, { transform: 'translateY(-7px)' }, IO], [hop + .62, { transform: 'translateY(0px)' }]]);
  play(s, [[hop, { transform: 'scale(1, 1)' }, IO], [hop + .14, { transform: 'scale(.9, 1.11)' }, IO],
           [hop + .34, { transform: 'scale(1.09, .92)' }, IO], [hop + .48, { transform: 'scale(.967, 1.045)' }, IO], [hop + .62, { transform: 'scale(1, 1)' }]]);
  play(g.querySelector('.rim'), [[hop + .13, { opacity: 1 }], [hop + .23, { opacity: 0 }]]);
}

if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const m = document.getElementById('m');
  // La M entra desde la izquierda; las copias van unos milisegundos detrás y hacen de estela
  [...m.children].forEach((el, i, all) => {
    const t = .3 + (all.length - 1 - i) * .004, op = +(el.getAttribute('opacity') ?? 1);
    play(el, [[0, { transform: 'translateX(-2309px)', opacity: 0 }, 'step-end'], [t, { transform: 'translateX(-2309px)', opacity: op }, OUT4],
              [t + .5, { transform: 'translateX(0px)', opacity: op }]]);
  });
  const [orange, white] = document.querySelectorAll('.wheel');
  wheel(orange, 1.033, 1.7);
  wheel(white, 1.6, 2.25);
  // Se queda quieto un momento y se desvanece entero antes de repetir
  play(document.querySelector('.logo'), [[P - .7, { opacity: 1 }], [P - .3, { opacity: 0 }]]);
}
</script>
</body>
</html>
