<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coches Muller · Pronto empezaremos</title>
<meta name="description" content="Coches Muller. Pronto empezaremos.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,800;1,500&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0f1a2c; --orange: #ff6b2c; --white: #fff; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    background: var(--navy); color: var(--white);
    font-family: Barlow, system-ui, sans-serif; font-style: italic;
    display: grid; place-items: center; text-align: center; padding: 24px 16px;
  }
  main { display: grid; justify-items: center; gap: 28px; width: 100%; }
  .logo { width: min(420px, 80vw); height: auto; overflow: visible; }

  /* Secuencia copiada del vídeo: la M entra con estela, luego cada rueda llega rodando por el suelo,
     salta y se queda como punto. Las ruedas repiten en bucle (spinner). */
  .m { animation: m-in .6s cubic-bezier(.15,.85,.25,1) .3s backwards; }
  /* La estela se recoge detrás de la M mientras frena */
  .trail use { animation: trail .5s cubic-bezier(.3,.7,.3,1) .3s backwards; }
  .wheel { animation: wheel 4.2s .9s infinite backwards; }
  .wheel .roll { animation: roll 4.2s .9s infinite backwards; }
  .wheel .rim { animation: rim 4.2s .9s infinite backwards; }
  .wheel .speed { animation: speed 4.2s .9s infinite backwards; }
  .wheel.white, .wheel.white * { animation-delay: 1.45s; }
  .text { animation: fade-in .6s .8s backwards; }

  @keyframes m-in { from { transform: translateX(-1400px); } }
  @keyframes trail { from { transform: translateX(var(--x)); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes wheel {
    /* 162 = baja la rueda hasta apoyarla en la base de la M */
    0%   { transform: translate(-900px, 162px); opacity: 0; animation-timing-function: cubic-bezier(.3,.6,.4,1); }
    3%   { opacity: 1; }
    12%  { transform: translate(-50px, 162px); }
    15%  { transform: translate(-50px, 162px) scale(1, 1); animation-timing-function: ease-out; }
    18%  { transform: translate(-20px, -25px) scale(.9, 1.12); animation-timing-function: ease-in; }
    21%  { transform: translate(0, 0) scale(1.1, .9); }
    24%, 82% { transform: translate(0, 0) scale(1, 1); opacity: 1; }
    90%, 100% { transform: translate(0, 0); opacity: 0; }
  }
  @keyframes roll {
    0%   { transform: rotate(-540deg); animation-timing-function: cubic-bezier(.3,.6,.4,1); }
    12%, 100% { transform: rotate(0); }
  }
  @keyframes rim { 0%, 15% { opacity: 1; } 19%, 100% { opacity: 0; } }
  @keyframes speed { 0% { opacity: 0; } 3% { opacity: .7; } 9% { opacity: .5; } 12%, 100% { opacity: 0; } }

  h1 { font-weight: 800; font-size: clamp(28px, 7vw, 56px); letter-spacing: .04em; line-height: 1; }
  h1 span { color: var(--orange); }
  p { margin-top: 14px; font-weight: 500; font-size: clamp(16px, 3.6vw, 22px); letter-spacing: .3em; opacity: .85; }
  .dots i { animation: blink 1.4s infinite; font-style: normal; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .trail, .rim, .speed { display: none; }
  }
</style>
</head>
<body>
<main>
  <!-- Coordenadas sacadas del logo original (IMG_1051) -->
  <svg class="logo" viewBox="140 600 1640 760" role="img" aria-label="Logo de Coches Muller">
    <defs>
      <polygon id="M" stroke-width="14" stroke-linejoin="round"
        points="962,640 1266,640 1300,905 1448,640 1752,640 1628,1282 1414,1282 1462,975 1290,1282 1152,1282 1120,972 1040,1282 828,1282"/>
      <!-- Llanta como en el vídeo: aro, buje y 5 tornillos -->
      <g id="rim" fill="var(--navy)">
        <circle r="98" fill="none" stroke="var(--navy)" stroke-width="7"/>
        <circle r="20"/>
        <circle r="8" cx="0" cy="-55"/>
        <circle r="8" cx="52" cy="-17"/>
        <circle r="8" cx="32" cy="45"/>
        <circle r="8" cx="-32" cy="45"/>
        <circle r="8" cx="-52" cy="-17"/>
      </g>
      <g id="speed" stroke-width="14" stroke-linecap="round">
        <line x1="-330" y1="-50" x2="-210" y2="-50"/>
        <line x1="-360" y1="0" x2="-210" y2="0"/>
        <line x1="-330" y1="50" x2="-210" y2="50"/>
      </g>
    </defs>

    <g class="m" fill="var(--white)" stroke="var(--white)">
      <g class="trail">
        <use href="#M" style="--x:-300px" opacity=".08"/>
        <use href="#M" style="--x:-240px" opacity=".16"/>
        <use href="#M" style="--x:-180px" opacity=".26"/>
        <use href="#M" style="--x:-120px" opacity=".38"/>
        <use href="#M" style="--x:-60px" opacity=".5"/>
      </g>
      <use href="#M"/>
    </g>

    <g transform="translate(678 966)"><g class="wheel">
      <use class="speed" href="#speed" stroke="var(--orange)"/>
      <g class="roll"><circle r="154" fill="var(--orange)"/><use class="rim" href="#rim"/></g>
    </g></g>
    <g transform="translate(320 966)"><g class="wheel white">
      <use class="speed" href="#speed" stroke="var(--white)"/>
      <g class="roll"><circle r="154" fill="var(--white)"/><use class="rim" href="#rim"/></g>
    </g></g>
  </svg>
  <div class="text">
    <h1>COCHES <span>MULLER</span></h1>
    <p>PRONTO EMPEZAREMOS<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
  </div>
</main>
</body>
</html>
